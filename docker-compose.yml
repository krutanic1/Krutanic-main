services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: krutanic-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # Python Job Scraper Microservice
  python-scraper:
    build:
      context: ./python-job-scraper
      dockerfile: Dockerfile
    container_name: krutanic-python-scraper
    ports:
      - "8001:8001"
    environment:
      - API_KEY=${PYTHON_API_KEY}
      - NODE_BACKEND_URL=http://backend:5000
      - MONGO_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - WORKER_TIMEOUT=180
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Node.js Backend (API Gateway)
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: krutanic-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - PYTHON_SERVICE_URL=http://python-scraper:8001
      - PYTHON_SERVICE_API_KEY=${PYTHON_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - python-scraper
      - redis
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
